[package]
name = "colyseus"
version = "0.1.0"
edition = "2021"
description = "A multiplayer game server framework for Rust — rooms, matchmaking, state sync, reconnection. Inspired by Colyseus."
license = "MIT"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
crc32fast = "1"
dashmap = "6"
futures = "0.3"
json-patch = "4"
nanoid = "0.4"
parking_lot = "0.12"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.30"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.26"
