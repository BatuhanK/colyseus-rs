[package]
name = "trivia-server"
version = "0.1.0"
edition = "2021"
description = "LLM-powered trivia game backend built on colyseus-rs"

[dependencies]
async-openai = { version = "0.34", features = ["_api", "chat-completion", "chat-completion-types"] }
colyseus = { path = "../../../crates/colyseus" }
axum = "0.8"
jsonwebtoken = "9"
nanoid = "0.4"
redis = { version = "0.27", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
